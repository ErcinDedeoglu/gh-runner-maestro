version: "3.8"

services:
  gh-runner-maestro:
    build: src
    image: gh-runner-maestro:latest
    privileged: true
    environment:
      - RUNNERS_MATRIX=[
          {"url":"https://github.com/ErcinDedeoglu/packmate","count":3,"labels":"dind,ubuntu-latest","token":"YOUR_GITHUB_TOKEN_1","image":"dublok/gh-runner:latest"},
          {"url":"https://github.com/ErcinDedeoglu/github-starboard","count":3,"labels":"dind,ubuntu-latest","token":"YOUR_GITHUB_TOKEN_2","image":"dublok/gh-runner:latest"}
        ]
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock   # <-- REMOVE THIS LINE for full DIND isolation
    restart: unless-stopped

networks:
  default:
    driver: bridge

# 
# This is a template. Replace YOUR_GITHUB_TOKEN_1 and YOUR_GITHUB_TOKEN_2 with actual GitHub personal access tokens for your targets.
# DO NOT commit your real credentials to source control!
#